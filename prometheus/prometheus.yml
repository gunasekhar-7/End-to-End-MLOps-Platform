global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'mlops-fraud-detection'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # Uncomment and configure for Alertmanager
      # - targets: ['alertmanager:9093']

rule_files:
  - 'rules.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FastAPI Fraud Detection API
  - job_name: 'fraud-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'fraud-detection-api'
          environment: 'development'
    scrape_interval: 10s

  # MLflow (if exporter available)
  - job_name: 'mlflow'
    static_configs:
      - targets: ['mlflow:5000']
        labels:
          service: 'mlflow'
          environment: 'development'
    scrape_interval: 30s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          environment: 'development'
    scrape_interval: 15s

  # MinIO metrics (if enabled)
  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'
          environment: 'development'
    scrape_interval: 30s
    metrics_path: '/minio/v2/metrics/cluster'