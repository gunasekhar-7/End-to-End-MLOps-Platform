groups:
  - name: fraud-detection-api
    interval: 30s
    rules:
      # High latency alert
      - alert: FraudAPIHighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket{job="fraud-api",handler=~"/predict.*"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: fraud-detection-api
        annotations:
          summary: "High prediction latency (p99 > 500ms)"
          description: "API p99 latency is {{ $value }}s for the last 5 minutes"
          runbook_url: "https://github.com/your-org/mlops-fraud-detection/blob/main/docs/runbooks/high_latency.md"

      # Error rate alert
      - alert: FraudAPIHighErrorRate
        expr: |
          (
            rate(http_requests_total{job="fraud-api",status=~"5.."}[5m])
            /
            rate(http_requests_total{job="fraud-api"}[5m])
          ) > 0.01
        for: 2m
        labels:
          severity: critical
          service: fraud-detection-api
        annotations:
          summary: "High error rate (> 1%)"
          description: "API error rate is {{ $value | humanizePercentage }} for the last 5 minutes"
          runbook_url: "https://github.com/your-org/mlops-fraud-detection/blob/main/docs/runbooks/high_error_rate.md"

      # Prediction drift alert
      - alert: FraudPredictionDrift
        expr: |
          abs(
            fraud_prediction_probability{endpoint="/predict"} - 0.5
          ) > 2 * on() fraud_prediction_probability_stddev{endpoint="/predict"}
        for: 10m
        labels:
          severity: warning
          service: fraud-detection-api
        annotations:
          summary: "Prediction distribution drift detected"
          description: "Fraud prediction probability has drifted {{ $value }} standard deviations from baseline"
          runbook_url: "https://github.com/your-org/mlops-fraud-detection/blob/main/docs/runbooks/prediction_drift.md"

      # Model staleness alert
      - alert: FraudModelStale
        expr: |
          (time() - fraud_model_last_trained_timestamp) > 30 * 24 * 3600
        for: 1h
        labels:
          severity: warning
          service: fraud-detection-api
        annotations:
          summary: "Model is stale (not retrained in 30+ days)"
          description: "Model was last trained {{ $value | humanizeDuration }} ago"
          runbook_url: "https://github.com/your-org/mlops-fraud-detection/blob/main/docs/runbooks/model_stale.md"

      # API down alert
      - alert: FraudAPIDown
        expr: up{job="fraud-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: fraud-detection-api
        annotations:
          summary: "Fraud Detection API is down"
          description: "API has been unreachable for more than 1 minute"
          runbook_url: "https://github.com/your-org/mlops-fraud-detection/blob/main/docs/runbooks/api_down.md"

  - name: mlflow
    interval: 60s
    rules:
      - alert: MLflowDown
        expr: up{job="mlflow"} == 0
        for: 2m
        labels:
          severity: warning
          service: mlflow
        annotations:
          summary: "MLflow server is down"
          description: "MLflow tracking server has been unreachable for more than 2 minutes"

  - name: infrastructure
    interval: 60s
    rules:
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High memory usage (> 90%)"
          description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
          service: infrastructure
        annotations:
          summary: "High CPU usage (> 90%)"
          description: "CPU usage is {{ $value }}% on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
          service: infrastructure
        annotations:
          summary: "Disk space low (< 10%)"
          description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}"