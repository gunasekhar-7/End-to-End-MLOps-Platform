# DVC Pipeline Definition
# Run with: dvc repro

stages:
  prepare:
    cmd: python -m mlops_fraud_detection.train.prepare_data
    deps:
      - src/mlops_fraud_detection/train/prepare_data.py
      - src/mlops_fraud_detection/common/utils.py
      - data/raw/fraud_data.csv
      - params.yaml
    outs:
      - data/processed/train.parquet:
          cache: true
      - data/processed/val.parquet:
          cache: true
      - data/processed/test.parquet:
          cache: true
      - models/preprocessor.pkl:
          cache: true
    params:
      - preprocessing.test_size
      - preprocessing.val_size
      - preprocessing.stratify
      - preprocessing.handle_missing
      - preprocessing.encode_categorical
      - preprocessing.scale_numeric

  train:
    cmd: python -m mlops_fraud_detection.train.train
    deps:
      - src/mlops_fraud_detection/train/train.py
      - src/mlops_fraud_detection/common/utils.py
      - data/processed/train.parquet
      - data/processed/val.parquet
      - models/preprocessor.pkl
      - params.yaml
    outs:
      - models/model.pkl:
          cache: true
    metrics:
      - metrics/train.json:
          cache: false
      - metrics/val.json:
          cache: false
    params:
      - training.model_type
      - training.n_estimators
      - training.max_depth
      - training.learning_rate
      - training.subsample
      - training.colsample_bytree
      - training.random_state
      - training.n_jobs
      - training.early_stopping_rounds
      - training.eval_metric
      - deployment_gates.min_f1
      - deployment_gates.min_precision
      - deployment_gates.min_recall
      - deployment_gates.min_pr_auc
      - deployment_gates.min_roc_auc
